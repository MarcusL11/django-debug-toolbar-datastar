name: Installed wheel

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test against released Django Debug Toolbar
        run: |
          python -m pip install dist/*.whl 'django-debug-toolbar==8.0.0'
          cd "$RUNNER_TEMP"
          export DJANGO_SETTINGS_MODULE=installed_settings
          export PYTHONPATH="$GITHUB_WORKSPACE/example:$GITHUB_WORKSPACE"
          python -m django check
          python -m django test addon_tests --noinput
          python -m django findstatic django_datastar_toolbar/js/datastar_store.js
          python "$GITHUB_WORKSPACE/example/smoke.py"
          DJDT_STATIC_ROOT="$RUNNER_TEMP/static" python -m django collectstatic --noinput --verbosity 0
          DJDT_MANIFEST=1 DJDT_STATIC_ROOT="$RUNNER_TEMP/manifest-static" python -m django collectstatic --noinput --verbosity 0
