name: Python package tests

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
        dependency-set: [minimum, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build pytest
      - if: matrix.dependency-set == 'minimum'
        run: python -m pip install -c tests/release/constraints-min.txt -e .
      - if: matrix.dependency-set == 'latest'
        run: python -m pip install -e .
      - run: python -m pytest tests/python
      - run: python -m build
      - if: matrix.dependency-set == 'minimum'
        run: python tests/release/check_wheel.py --constraints tests/release/constraints-min.txt dist/*.whl
      - if: matrix.dependency-set == 'latest'
        run: python tests/release/check_wheel.py dist/*.whl
