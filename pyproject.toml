[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-debug-toolbar-datastar"
version = "0.1.0rc1"
description = "Community-maintained Datastar signal projection panel for Django Debug Toolbar"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["django>=5.2", "django-debug-toolbar>=8.0.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/MarcusL11/django-debug-toolbar-datastar"
Issues = "https://github.com/MarcusL11/django-debug-toolbar-datastar/issues"
Source = "https://github.com/MarcusL11/django-debug-toolbar-datastar"

[tool.hatch.build.targets.wheel]
packages = ["src/django_datastar_toolbar"]

[tool.hatch.build.targets.sdist]
include = ["/src/django_datastar_toolbar", "/README.md", "/LICENSE", "/pyproject.toml"]
